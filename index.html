<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#05070d"
    >

    <title>PROJECT: VOID</title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=2"
    >

</head>

<body>

    <!-- LOADING -->

    <div id="loading">

        <div class="loading-title">
            PROJECT: VOID
        </div>

        <div class="loading-subtitle">
            INITIALIZING SYSTEM...
        </div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div id="game-title">
            PROJECT: VOID
        </div>

        <div id="location">
            CENTRAL HUB
        </div>

    </div>


    <!-- TASK PANEL -->

    <div id="task-panel">

        <div class="task-header">
            TASKS
        </div>

        <div id="task-list">
            Initializing...
        </div>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

        <div id="joystick-knob"></div>

    </div>


    <!-- INTERACTION -->

    <button
        id="interact-button"
        type="button"
    >
        INTERACT
    </button>


    <!-- ERROR -->

    <div id="void-error">

        <div id="void-error-box">

            <div id="void-error-title">
                PROJECT: VOID — ERROR
            </div>

            <pre id="void-error-message">
Unknown error.
            </pre>

        </div>

    </div>


    <!-- GAME -->

    <script
        type="module"
        src="./js/main.js?v=2"
    ></script>

</body>

</html>
