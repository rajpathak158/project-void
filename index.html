<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>PROJECT: VOID</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


    <!-- HUD -->

    <div id="hud">

        <div id="game-title">
            PROJECT: VOID
        </div>

        <div id="location">
            CENTRAL HUB
        </div>

    </div>


    <!-- Interaction -->

    <div id="interaction">
        TAP TO INTERACT
    </div>


    <!-- Mobile joystick -->

    <div id="joystick">

        <div id="joystick-knob"></div>

    </div>


    <!-- GAME -->

    <script type="module">

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        import world from
            "./js/world.js";


        import PlayerController from
            "./js/player.js";


        import CollisionSystem from
            "./js/collision.js";


        /*
        ==========================================
        SCENE
        ==========================================
        */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x050509
            );


        /*
        ==========================================
        FOG
        ==========================================
        */

        scene.fog =
            new THREE.Fog(
                0x050509,
                12,
                35
            );


        /*
        ==========================================
        CAMERA
        ==========================================
        */

        const camera =
            new THREE.PerspectiveCamera(
                65,
                window.innerWidth /
                window.innerHeight,
                0.1,
                100
            );


        camera.position.set(
            0,
            4,
            12
        );


        /*
        ==========================================
        RENDERER
        ==========================================
        */

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true,
                powerPreference:
                    "high-performance"
            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        document.body.appendChild(
            renderer.domElement
        );


        /*
        ==========================================
        LIGHTING
        ==========================================
        */

        const ambient =
            new THREE.HemisphereLight(
                0x7c7cff,
                0x080810,
                1.4
            );


        scene.add(
            ambient
        );


        const mainLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );


        mainLight.position.set(
            0,
            10,
            5
        );


        mainLight.castShadow =
            true;


        scene.add(
            mainLight
        );


        /*
        ==========================================
        COLLISION SYSTEM
        ==========================================
        */

        const collision =
            new CollisionSystem();


        /*
        ==========================================
        BUILD WORLD
        ==========================================
        */

        const station =
            world.create(
                scene,
                collision
            );


        /*
        ==========================================
        PLAYER
        ==========================================
        */

        const player =
            new PlayerController(
                scene,
                camera,
                collision
            );


        /*
        ==========================================
        CLOCK
        ==========================================
        */

        const clock =
            new THREE.Clock();


        /*
        ==========================================
        GAME LOOP
        ==========================================
        */

        function animate() {

            requestAnimationFrame(
                animate
            );


            const delta =
                Math.min(
                    clock.getDelta(),
                    0.05
                );


            player.update(
                delta
            );


            renderer.render(
                scene,
                camera
            );

        }


        /*
        ==========================================
        RESIZE
        ==========================================
        */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /*
        ==========================================
        START
        ==========================================
        */

        console.log(
            "PROJECT: VOID initialized."
        );


        console.log(
            "Rooms:",
            station.rooms
        );


        console.log(
            "Tasks:",
            station.tasks
        );


        animate();

    </script>

</body>

</html>
