<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta
        name="screen-orientation"
        content="landscape"
    >

    <meta
        name="orientation"
        content="landscape"
    >

    <title>PROJECT: VOID</title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=4"
    >

    <style>

        /*
        ==========================================
        GAME CANVAS
        ==========================================
        */

        #game-canvas {

            position: fixed;

            inset: 0;

            width: 100vw !important;

            height: 100vh !important;

            display: block;

            z-index: 1;

            touch-action: none;

        }


        /*
        ==========================================
        HUD
        ==========================================
        */

        #hud {

            position: fixed;

            z-index: 20;

            pointer-events: none;

        }


        /*
        ==========================================
        JOYSTICK
        ==========================================
        */

        #joystick {

            z-index: 30;

        }


        /*
        ==========================================
        ERROR SCREEN
        ==========================================
        */

        #void-error {

            position: fixed;

            inset: 0;

            z-index: 999999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            box-sizing: border-box;

            background:
                rgba(3,4,10,0.97);

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #void-error-box {

            width:
                min(650px, 92vw);

            max-height: 80vh;

            overflow: auto;

            padding: 25px;

            border-radius: 18px;

            border:
                1px solid
                rgba(255,80,100,0.45);

            background:
                #10121c;

            box-shadow:
                0 20px 80px
                rgba(0,0,0,0.7);

        }


        #void-error-title {

            font-size: 22px;

            font-weight: 800;

            margin-bottom: 12px;

        }


        #void-error-message {

            color: #ff8d9b;

            font-size: 13px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-break: break-word;

        }


        #void-error-help {

            margin-top: 18px;

            color: #9da4bc;

            font-size: 12px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


    <!-- ==========================================
         LANDSCAPE WARNING
    =========================================== -->

    <div id="landscape-warning">

        <div class="rotate-icon">
            📱
        </div>

        <h2>
            ROTATE YOUR PHONE
        </h2>

        <p>
            PROJECT: VOID is designed
            for landscape mode.
        </p>

    </div>


    <!-- ==========================================
         HUD
    ========================================== -->

    <div id="hud">

        <div id="game-title">
            PROJECT: VOID
        </div>

        <div id="location">
            CENTRAL HUB
        </div>

    </div>


    <!-- ==========================================
         INTERACTION
    ========================================== -->

    <div id="interaction">
        TAP TO INTERACT
    </div>


    <!-- ==========================================
         MOBILE JOYSTICK
    ========================================== -->

    <div id="joystick">

        <div id="joystick-knob"></div>

    </div>


    <!-- ==========================================
         ERROR DISPLAY
    ========================================== -->

    <div id="void-error">

        <div id="void-error-box">

            <div id="void-error-title">
                PROJECT: VOID — ERROR
            </div>

            <div id="void-error-message">
                Unknown error.
            </div>

            <div id="void-error-help">

                The game stopped while loading.
                Send me a screenshot of this
                error and I can identify the
                exact file causing it.

            </div>

        </div>

    </div>


    <!-- ==========================================
         GAME
    ========================================== -->

    <script type="module">

        /*
        ==========================================
        ERROR HANDLER
        ==========================================
        */

        function showVoidError(
            message
        ) {

            console.error(
                "PROJECT: VOID ERROR:",
                message
            );


            const screen =
                document.getElementById(
                    "void-error"
                );


            const output =
                document.getElementById(
                    "void-error-message"
                );


            if (
                screen &&
                output
            ) {

                output.textContent =
                    String(message);

                screen.style.display =
                    "flex";

            }

        }


        window.addEventListener(
            "error",
            event => {

                showVoidError(
                    event.error
                        ? (
                            event.error.stack ||
                            event.error.message
                        )
                        : event.message
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            event => {

                showVoidError(
                    event.reason &&
                    event.reason.stack
                        ? event.reason.stack
                        : String(
                            event.reason
                        )
                );

            }
        );


        /*
        ==========================================
        THREE.JS
        ==========================================
        */

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        /*
        ==========================================
        WORLD
        ==========================================
        */

        import world from
            "./js/world.js?v=4";


        /*
        ==========================================
        PLAYER
        ==========================================
        */

        import PlayerController from
            "./js/player.js?v=4";


        /*
        ==========================================
        COLLISION
        ==========================================
        */

        import CollisionSystem from
            "./js/collision.js?v=4";


        /*
        ==========================================
        TASK SYSTEM
        ==========================================
        */

        import TaskSystem from
            "./js/tasks.js?v=4";


        /*
        ==========================================
        SCENE
        ==========================================
        */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x050509
            );


        /*
        ==========================================
        FOG
        ==========================================
        */

        scene.fog =
            new THREE.Fog(
                0x050509,
                12,
                35
            );


        /*
        ==========================================
        CAMERA
        ==========================================
        */

        const camera =
            new THREE.PerspectiveCamera(
                65,
                window.innerWidth /
                window.innerHeight,
                0.1,
                200
            );


        camera.position.set(
            0,
            4,
            12
        );


        /*
        ==========================================
        RENDERER
        ==========================================
        */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                powerPreference:
                    "high-performance"

            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.5
            )
        );


        /*
        ==========================================
        SHADOWS
        ==========================================
        */

        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        /*
        ==========================================
        CANVAS
        ==========================================
        */

        renderer.domElement.id =
            "game-canvas";


        document.body.appendChild(
            renderer.domElement
        );


        /*
        ==========================================
        LIGHTING
        ==========================================
        */

        const ambient =
            new THREE.HemisphereLight(
                0x7c7cff,
                0x080810,
                1.4
            );


        scene.add(
            ambient
        );


        const mainLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );


        mainLight.position.set(
            0,
            10,
            5
        );


        mainLight.castShadow =
            true;


        scene.add(
            mainLight
        );


        /*
        ==========================================
        COLLISION SYSTEM
        ==========================================
        */

        const collision =
            new CollisionSystem();


        /*
        ==========================================
        BUILD WORLD
        ==========================================
        */

        const station =
            world.create(
                scene,
                collision
            );


        /*
        ==========================================
        SAFETY CHECK
        ==========================================
        */

        if (
            !station
        ) {

            throw new Error(
                "world.create() did not return a station object."
            );

        }


        /*
        ==========================================
        PLAYER
        ==========================================
        */

        const player =
            new PlayerController(
                scene,
                camera,
                collision
            );


        /*
        ==========================================
        TASK SYSTEM
        ==========================================
        */

        const tasks =
            new TaskSystem(
                scene,
                camera,
                player
            );


        /*
        ==========================================
        FIND TASK OBJECTS
        ==========================================
        */

        const taskObjects = [];

        const registeredObjects =
            new Set();


        scene.traverse(
            object => {

                if (
                    !object.userData
                ) {

                    return;

                }


                if (
                    object.userData.type !==
                    "task"
                ) {

                    return;

                }


                if (
                    registeredObjects.has(
                        object
                    )
                ) {

                    return;

                }


                registeredObjects.add(
                    object
                );


                taskObjects.push(
                    object
                );

            }
        );


        /*
        ==========================================
        REGISTER TASKS
        ==========================================
        */

        for (
            const object of taskObjects
        ) {

            tasks.register(

                object,

                object.userData.label ||
                "TASK"

            );

        }


        /*
        ==========================================
        CLOCK
        ==========================================
        */

        const clock =
            new THREE.Clock();


        /*
        ==========================================
        GAME LOOP
        ==========================================
        */

        function animate() {

            requestAnimationFrame(
                animate
            );


            const delta =
                Math.min(
                    clock.getDelta(),
                    0.05
                );


            /*
            PLAYER
            */

            player.update(
                delta
            );


            /*
            TASKS
            */

            tasks.update();


            /*
            RENDER
            */

            renderer.render(
                scene,
                camera
            );

        }


        /*
        ==========================================
        RESIZE
        ==========================================
        */

        function resizeGame() {

            const width =
                Math.max(
                    1,
                    window.innerWidth
                );


            const height =
                Math.max(
                    1,
                    window.innerHeight
                );


            camera.aspect =
                width /
                height;


            camera.updateProjectionMatrix();


            renderer.setSize(
                width,
                height
            );


            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio,
                    1.5
                )
            );

        }


        window.addEventListener(
            "resize",
            resizeGame
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    resizeGame,
                    150
                );

            }
        );


        /*
        ==========================================
        DEBUG
        ==========================================
        */

        console.log(
            "================================"
        );

        console.log(
            "PROJECT: VOID"
        );

        console.log(
            "================================"
        );

        console.log(
            "Station:",
            station
        );

        console.log(
            "Rooms:",
            station.rooms || []
        );

        console.log(
            "World task objects:",
            taskObjects.length
        );


        /*
        IMPORTANT:
        Do NOT assume station.tasks exists.
        */

        const expectedTasks =
            Array.isArray(
                station.tasks
            )
                ? station.tasks.length
                : taskObjects.length;


        console.log(
            "Expected tasks:",
            expectedTasks
        );


        if (
            taskObjects.length !==
            expectedTasks
        ) {

            console.warn(
                "WARNING: Task object count does not match expected task count."
            );

        } else {

            console.log(
                "TASK SYSTEM: OK"
            );

        }


        /*
        ==========================================
        START
        ==========================================
        */

        resizeGame();

        animate();


        /*
        ==========================================
        SUCCESS MESSAGE
        ==========================================
        */

        console.log(
            "PROJECT: VOID ENGINE STARTED"
        );

    </script>

</body>

</html>
