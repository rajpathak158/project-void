<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta
        name="screen-orientation"
        content="landscape"
    >

    <meta
        name="orientation"
        content="landscape"
    >

    <title>PROJECT: VOID</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


    <!-- ==========================================
         LANDSCAPE WARNING
    =========================================== -->

    <div id="landscape-warning">

        <div class="rotate-icon">
            📱
        </div>

        <h2>
            ROTATE YOUR PHONE
        </h2>

        <p>
            PROJECT: VOID is designed
            for landscape mode.
        </p>

    </div>


    <!-- ==========================================
         HUD
    =========================================== -->

    <div id="hud">

        <div id="game-title">
            PROJECT: VOID
        </div>

        <div id="location">
            CENTRAL HUB
        </div>

    </div>


    <!-- ==========================================
         INTERACTION
    ========================================== -->

    <div id="interaction">
        TAP TO INTERACT
    </div>


    <!-- ==========================================
         MOBILE JOYSTICK
    ========================================== -->

    <div id="joystick">

        <div id="joystick-knob"></div>

    </div>


    <!-- ==========================================
         GAME
    ========================================== -->

    <script type="module">


        /*
        ==========================================
        THREE.JS
        ==========================================
        */

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        /*
        ==========================================
        WORLD
        ==========================================
        */

        import world from
            "./js/world.js";


        /*
        ==========================================
        PLAYER
        ==========================================
        */

        import PlayerController from
            "./js/player.js";


        /*
        ==========================================
        COLLISION
        ==========================================
        */

        import CollisionSystem from
            "./js/collision.js";


        /*
        ==========================================
        TASK SYSTEM
        ==========================================
        */

        import TaskSystem from
            "./js/tasks.js";


        /*
        ==========================================
        SCENE
        ==========================================
        */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x050509
            );


        /*
        ==========================================
        FOG
        ==========================================
        */

        scene.fog =
            new THREE.Fog(
                0x050509,
                12,
                35
            );


        /*
        ==========================================
        CAMERA
        ==========================================
        */

        const camera =
            new THREE.PerspectiveCamera(
                65,
                window.innerWidth /
                window.innerHeight,
                0.1,
                100
            );


        camera.position.set(
            0,
            4,
            12
        );


        /*
        ==========================================
        RENDERER
        ==========================================
        */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                powerPreference:
                    "high-performance"

            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        /*
        ==========================================
        CANVAS
        ==========================================
        */

        renderer.domElement.id =
            "game-canvas";


        document.body.appendChild(
            renderer.domElement
        );


        /*
        ==========================================
        LIGHTING
        ==========================================
        */

        const ambient =
            new THREE.HemisphereLight(
                0x7c7cff,
                0x080810,
                1.4
            );


        scene.add(
            ambient
        );


        const mainLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );


        mainLight.position.set(
            0,
            10,
            5
        );


        mainLight.castShadow =
            true;


        scene.add(
            mainLight
        );


        /*
        ==========================================
        COLLISION SYSTEM
        ==========================================
        */

        const collision =
            new CollisionSystem();


        /*
        ==========================================
        BUILD WORLD
        ==========================================
        */

        const station =
            world.create(
                scene,
                collision
            );


        /*
        ==========================================
        PLAYER
        ==========================================
        */

        const player =
            new PlayerController(
                scene,
                camera,
                collision
            );


        /*
        ==========================================
        TASK SYSTEM
        ==========================================
        */

        const tasks =
            new TaskSystem(
                scene,
                camera,
                player
            );


        /*
        ==========================================
        REGISTER WORLD TASKS
        ==========================================
        */

        const taskObjects =
            [];


        scene.traverse(
            object => {

                if (
                    object.userData &&
                    object.userData.type ===
                    "task"
                ) {

                    taskObjects.push(
                        object
                    );

                }

            }
        );


        taskObjects.forEach(
            object => {

                tasks.register(
                    object,
                    object.userData.label ||
                    "TASK"
                );

            }
        );


        /*
        ==========================================
        CLOCK
        ==========================================
        */

        const clock =
            new THREE.Clock();


        /*
        ==========================================
        GAME LOOP
        ==========================================
        */

        function animate() {

            requestAnimationFrame(
                animate
            );


            const delta =
                Math.min(
                    clock.getDelta(),
                    0.05
                );


            player.update(
                delta
            );


            tasks.update();


            renderer.render(
                scene,
                camera
            );

        }


        /*
        ==========================================
        RESIZE
        ==========================================
        */

        function resizeGame() {

            const width =
                window.innerWidth;


            const height =
                window.innerHeight;


            camera.aspect =
                width / height;


            camera.updateProjectionMatrix();


            renderer.setSize(
                width,
                height
            );

        }


        window.addEventListener(
            "resize",
            resizeGame
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    resizeGame,
                    150
                );

            }
        );


        /*
        ==========================================
        DEBUG
        ==========================================
        */

        console.log(
            "PROJECT: VOID initialized."
        );


        console.log(
            "Rooms:",
            station.rooms
        );


        console.log(
            "Tasks:",
            station.tasks
        );


        console.log(
            "Task objects:",
            taskObjects.length
        );


        /*
        ==========================================
        START
        ==========================================
        */

        resizeGame();

        animate();


    </script>

</body>

</html>
