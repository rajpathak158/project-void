/*
==================================================
ERROR SYSTEM
==================================================
*/

function showError(error) {

    console.error(
        "PROJECT: VOID ERROR",
        error
    );

    const screen =
        document.getElementById(
            "void-error"
        );

    const message =
        document.getElementById(
            "void-error-message"
        );

    if (!screen || !message) {

        return;

    }

    let text = "";

    if (error instanceof Error) {

        text =
            error.stack ||
            error.message;

    } else {

        text =
            String(error);

    }

    message.textContent = text;

    screen.style.display =
        "flex";

}


window.addEventListener(
    "error",
    event => {

        if (event.error) {

            showError(
                event.error
            );

        } else {

            showError(
                event.message
            );

        }

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        showError(

);

/*
==================================================
JOYSTICK
==================================================
*/

const joystick =
    document.getElementById(
        "joystick"
    );


const knob =
    document.getElementById(
        "joystick-knob"
    );


let joystickActive =
    false;


let joystickX = 0;
let joystickY = 0;


let joystickId =
    null;


function updateJoystick(
    x,
    y
) {

    const rect =
        joystick.getBoundingClientRect();


    const cx =
        rect.left +
        rect.width / 2;


    const cy =
        rect.top +
        rect.height / 2;


    let dx =
        x - cx;


    let dy =
        y - cy;


    const max =
        42;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > max
    ) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;

    }


    joystickX =
        dx / max;


    joystickY =
        dy / max;


    knob.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


joystick.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        const touch =
            event.changedTouches[0];

        joystickId =
            touch.identifier;

        joystickActive =
            true;

        updateJoystick(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        if (!joystickActive) {

            return;

        }


        for (
            const touch of
            event.changedTouches
        ) {

            if (
                touch.identifier ===
                joystickId
            ) {

                updateJoystick(
                    touch.clientX,
                    touch.clientY
                );

            }

        }

    },
    {
        passive: false
    }
);


function stopJoystick() {

    joystickActive =
        false;

    joystickId =
        null;

    joystickX =
        0;

    joystickY =
        0;

    knob.style.transform =
        "translate(-50%, -50%)";

}


joystick.addEventListener(
    "touchend",
    stopJoystick
);

);


/*
==================================================
CAMERA
==================================================
*/

let cameraYaw =
    0;


let cameraPitch =
    0.25;


let cameraDistance =
    10;


let cameraTouch =
    null;


let lastX =
    0;


let lastY =
    0;


renderer.domElement.addEventListener(
    "touchstart",
    event => {

        for (
            const touch of
            event.changedTouches
        ) {

            if (
                touch.clientX <
                window.innerWidth * 0.4
            ) {

                continue;

            }


            cameraTouch =
                touch.identifier;

            lastX =
                touch.clientX;

            lastY =
                touch.clientY;

        }

    },
    {
        passive: true
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    event => {

        if (
            cameraTouch === null
        ) {

            return;

        }


        for (
            const touch of
            event.changedTouches
        ) {

            if (
                touch.identifier !==
                cameraTouch
            ) {

                continue;

            }


            const dx =
                touch.clientX -
                lastX;


            const dy =
                touch.clientY -
                lastY;


            cameraYaw -=
                dx * 0.008;


            cameraPitch -=
                dy * 0.006;


            cameraPitch =
                THREE.MathUtils.clamp(
                    cameraPitch,
                    -0.4,
                    0.8
                );


            lastX =
                touch.clientX;

            lastY =
                touch.clientY;

        }

    },
    {
        passive: true
    }
);


renderer.domElement.addEventListener(
    "touchend",
    () => {

        cameraTouch =
            null;

    }
);


/*
==================================================
MOUSE CAMERA
==================================================
*/

let mouseDown =
    false;


let mouseX =
    0;


let mouseY =
    0;


window.addEventListener(
    "mousedown",
    event => {

        mouseDown =
            true;

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;

    }
);


window.addEventListener(
    "mouseup",
    () => {

        mouseDown =
            false;

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (!mouseDown) {

            return;

        }


        const dx =
            event.clientX -
            mouseX;


        const dy =
            event.clientY -
            mouseY;


        cameraYaw -=
            dx * 0.006;


        cameraPitch -=
            dy * 0.006;


        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                -0.4,
                0.8
            );


        mouseX =
            event.clientX;

        mouseY =
            event.clientY;

    }
);


/*
==================================================
GAME LOOP
==================================================
*/

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    /*
    KEYBOARD
    */

    let moveX =
        joystickActive
            ? joystickX
            : 0;


    let moveZ =
        joystickActive
            ? joystickY
            : 0;


    if (!joystickActive) {

        if (
            keys["KeyA"] ||
            keys["ArrowLeft"]
        ) {

            moveX -= 1;

        }


        if (
            keys["KeyD"] ||
            keys["ArrowRight"]
        ) {

            moveX += 1;

        }


        if (
            keys["KeyW"] ||
            keys["ArrowUp"]
        ) {

            moveZ -= 1;

        }


        if (
            keys["KeyS"] ||
            keys["ArrowDown"]
        ) {

            moveZ += 1;

        }

    }


    /*
    MOVEMENT
    */

    const moving =
        Math.abs(moveX) >
        0.01 ||
        Math.abs(moveZ) >
        0.01;


    if (moving) {

        const length =
            Math.sqrt(
                moveX * moveX +
                moveZ * moveZ
            );


        moveX /=
            Math.max(
                length,
                1
            );


        moveZ /=
            Math.max(
                length,
                1
            );


        const speed =
            5;


        const sin =
            Math.sin(
                cameraYaw
            );


        const cos =
            Math.cos(
                cameraYaw
            );


        const dx =
            (-moveX * cos) +
            (-moveZ * sin);


        const dz =
            (moveX * sin) +
            (-moveZ * cos);


        player.position.x +=
            dx *
            speed *
            delta;


        player.position.z +=
            dz *
            speed *
            delta;


        /*
        Simple world boundary.
        */

        player.position.x =
            THREE.MathUtils.clamp(
                player.position.x,
                -23,
                23
            );


        player.position.z =
            THREE.MathUtils.clamp(
                player.position.z,
                -22,
                22
            );


        player.rotation.y =
            Math.atan2(
                dx,
                dz
            );

    }


    /*
    PLAYER BOB
    */

    if (moving) {

        player.position.y =
            Math.sin(
                performance.now() *
                0.012
            ) *
            0.025;

    } else {

        player.position.y =
            0;

    }


    /*
    CAMERA
    */

    const target =
        new THREE.Vector3(
            player.position.x,
            1.5,
            player.position.z
        );


    const horizontal =
        cameraDistance *
        Math.cos(
            cameraPitch
        );


    const desired =
        new THREE.Vector3(

            player.position.x -
            Math.sin(cameraYaw) *
            horizontal,

            player.position.y +
            4 +
            cameraDistance *
            Math.sin(cameraPitch),

            player.position.z -
            Math.cos(cameraYaw) *
            horizontal

        );


    camera.position.lerp(
        desired,
        Math.min(
            1,
            delta * 7
        )
    );


    camera.lookAt(
        target
    );


    /*
    CORE ANIMATION
    */

    core.rotation.y +=
        delta * 1.5;


    renderer.render(
        scene,
        camera
    );

}


/*
==================================================
RESIZE
==================================================
*/

function resize() {

    const width =
        Math.max(
            1,
            window.innerWidth
        );


    const height =
        Math.max(
            1,
            window.innerHeight
        );


    camera.aspect =
        width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );

}


window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            resize,
            150
        );

    }
);
