<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>PROJECT: VOID</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050509;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;

            color: white;

            z-index: 10;

            text-shadow:
                0 0 5px black,
                0 0 12px #6d4aff;

            pointer-events: none;
        }

        #title {
            font-size: 22px;
            font-weight: bold;
        }

        #status {
            margin-top: 6px;
            opacity: 0.8;
        }

        #crosshair {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 8px;
            height: 8px;

            border: 1px solid white;
            border-radius: 50%;

            opacity: 0.7;

            pointer-events: none;
        }

        #loading {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #050509;

            color: white;

            font-size: 24px;

            z-index: 100;
        }

    </style>
</head>

<body>

    <div id="loading">
        INITIALIZING VOID...
    </div>

    <div id="hud">

        <div id="title">
            PROJECT: VOID
        </div>

        <div id="status">
            Prototype 0.1
        </div>

    </div>

    <div id="crosshair"></div>


    <!-- Three.js -->

    <script type="module">

        import * as THREE
        from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        /*
        ==========================================
        SCENE
        ==========================================
        */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x050509
            );


        /*
        ==========================================
        CAMERA
        ==========================================
        */

        const camera =
            new THREE.PerspectiveCamera(
                70,
                window.innerWidth /
                window.innerHeight,
                0.1,
                1000
            );


        camera.position.set(
            0,
            2.2,
            7
        );


        /*
        ==========================================
        RENDERER
        ==========================================
        */

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        document.body.appendChild(
            renderer.domElement
        );


        /*
        ==========================================
        LIGHTING
        ==========================================
        */

        const ambientLight =
            new THREE.AmbientLight(
                0x8888aa,
                1.5
            );


        scene.add(
            ambientLight
        );


        const mainLight =
            new THREE.PointLight(
                0x6644ff,
                25,
                30
            );


        mainLight.position.set(
            0,
            6,
            0
        );


        scene.add(
            mainLight
        );


        /*
        ==========================================
        FLOOR
        ==========================================
        */

        const floorGeometry =
            new THREE.BoxGeometry(
                30,
                0.3,
                30
            );


        const floorMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x15151d,
                roughness: 0.8
            });


        const floor =
            new THREE.Mesh(
                floorGeometry,
                floorMaterial
            );


        floor.position.y =
            -0.15;


        scene.add(
            floor
        );


        /*
        ==========================================
        WALL MATERIAL
        ==========================================
        */

        const wallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x242430,
                roughness: 0.7
            });


        /*
        ==========================================
        WALL CREATION
        ==========================================
        */

        function createWall(
            x,
            y,
            z,
            width,
            height,
            depth
        ) {

            const geometry =
                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                );


            const wall =
                new THREE.Mesh(
                    geometry,
                    wallMaterial
                );


            wall.position.set(
                x,
                y,
                z
            );


            scene.add(
                wall
            );

        }


        /*
        ==========================================
        ROOM
        ==========================================
        */

        createWall(
            0,
            2,
            -10,
            20,
            4,
            0.5
        );


        createWall(
            0,
            2,
            10,
            20,
            4,
            0.5
        );


        createWall(
            -10,
            2,
            0,
            0.5,
            4,
            20
        );


        createWall(
            10,
            2,
            0,
            0.5,
            4,
            20
        );


        /*
        ==========================================
        PLAYER
        ==========================================
        */

        const player =
            new THREE.Group();


        /*
        BODY
        */

        const bodyGeometry =
            new THREE.CapsuleGeometry(
                0.45,
                0.8,
                8,
                16
            );


        const bodyMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x3366ff,
                roughness: 0.5
            });


        const body =
            new THREE.Mesh(
                bodyGeometry,
                bodyMaterial
            );


        body.position.y =
            1.1;


        player.add(
            body
        );


        /*
        HEAD
        */

        const headGeometry =
            new THREE.SphereGeometry(
                0.48,
                20,
                20
            );


        const headMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x4477ff
            });


        const head =
            new THREE.Mesh(
                headGeometry,
                headMaterial
            );


        head.position.y =
            2;


        player.add(
            head
        );


        /*
        VISOR
        */

        const visorGeometry =
            new THREE.SphereGeometry(
                0.25,
                16,
                16
            );


        const visorMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x66ddff,
                metalness: 0.7,
                roughness: 0.2
            });


        const visor =
            new THREE.Mesh(
                visorGeometry,
                visorMaterial
            );


        visor.position.set(
            0,
            2.05,
            -0.4
        );


        visor.scale.set(
            1,
            0.8,
            0.4
        );


        player.add(
            visor
        );


        /*
        PLAYER POSITION
        */

        player.position.set(
            0,
            0,
            5
        );


        scene.add(
            player
        );


        /*
        ==========================================
        MOBILE MOVEMENT
        ==========================================
        */

        let targetX = 0;
        let targetZ = 5;


        renderer.domElement
            .addEventListener(
                "touchstart",
                event => {

                    const touch =
                        event.touches[0];


                    targetX =
                        (
                            touch.clientX /
                            window.innerWidth
                            - 0.5
                        ) * 10;


                    targetZ =
                        8 -
                        (
                            touch.clientY /
                            window.innerHeight
                        ) * 16;

                }
            );


        renderer.domElement
            .addEventListener(
                "touchmove",
                event => {

                    const touch =
                        event.touches[0];


                    targetX =
                        (
                            touch.clientX /
                            window.innerWidth
                            - 0.5
                        ) * 10;


                    targetZ =
                        8 -
                        (
                            touch.clientY /
                            window.innerHeight
                        ) * 16;


                    event.preventDefault();

                },
                {
                    passive: false
                }
            );


        /*
        ==========================================
        ANIMATION LOOP
        ==========================================
        */

        const clock =
            new THREE.Clock();


        function animate() {

            requestAnimationFrame(
                animate
            );


            const delta =
                clock.getDelta();


            /*
            Smooth movement
            */

            player.position.x +=
                (
                    targetX -
                    player.position.x
                ) *
                delta *
                5;


            player.position.z +=
                (
                    targetZ -
                    player.position.z
                ) *
                delta *
                5;


            /*
            Camera follows player
            */

            camera.position.x =
                player.position.x;


            camera.position.z =
                player.position.z + 7;


            camera.lookAt(
                player.position.x,
                1.5,
                player.position.z
            );


            /*
            Render
            */

            renderer.render(
                scene,
                camera
            );

        }


        /*
        ==========================================
        WINDOW RESIZE
        ==========================================
        */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /*
        ==========================================
        START
        ==========================================
        */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        animate();

    </script>

</body>
</html>
